<style>
:root{--navy:#0A2A55;--blue:#1857A5;--ink:#0f1b2d;--mute:#5d6b7d;--line:#dde3ea}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#eef1f5;color:var(--ink);font-family:Pretendard,"Malgun Gothic",sans-serif;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}

.bar .lg{display:block;flex:none}
.bar .lg img{display:block;height:24px;width:auto}
.bar .ttl{flex:1;min-width:0;font-size:15px;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 16px;border-radius:40px;font:700 14px/1 Pretendard,sans-serif;text-decoration:none;cursor:pointer;white-space:nowrap;border:1px solid var(--navy)}
.btn.b1{background:var(--navy);color:#fff}
.btn.b1:hover{background:var(--blue);border-color:var(--blue)}
.btn.b2{background:#fff;color:var(--navy)}
.btn.b2:hover{background:#f2f6fb}
.btn small{font-weight:500;opacity:.8;font-size:12.5px}
#deck{max-width:1280px;margin:0 auto;padding:22px 16px 8px;display:grid;gap:26px}
.sl{margin:0;scroll-margin-top:70px}
.stage{position:relative;overflow:hidden;aspect-ratio:16/9;border-radius:6px;background:#fff;box-shadow:0 6px 24px rgba(10,42,85,.12);container-type:inline-size}
.full{display:block;width:100%;height:100%}
.js .stage.rp{cursor:pointer}
.pn{margin:7px 2px 0;font-size:12.5px;color:var(--mute);text-align:right}
/* 움직임 화면(1920×1080 좌표, 크기는 --s로 맞춤) */
.cv{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;transform:scale(var(--s,1));pointer-events:none;background:#fff}
.cv .plate{position:absolute;left:0;top:0;width:1920px;height:1080px}
.ly{position:absolute;visibility:hidden;background-repeat:no-repeat}
.mul{mix-blend-mode:multiply}
.ph{overflow:hidden}
.ph .phv{position:absolute;left:0;top:0;height:100%;width:0;overflow:hidden}
.ph .phv img{position:absolute;max-width:none}
.ph .cur{position:absolute;left:0;top:0;height:100%;width:0;background:var(--blue)}
.ring{border:2.6px solid;border-radius:50%}
.cnt{font-family:Pretendard,sans-serif;font-weight:800;line-height:1;white-space:nowrap}
/* 표지 (홈페이지 첫 화면과 같은 제어반 장면) */
.cvr{background:#050b16}
.cvr .bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#050b16}
.cvr .lg2{position:absolute;left:7.8125%;top:27.78%;height:5.37%;width:auto}
.cvr .kk{position:absolute;left:7.708%;top:36.2%;margin:0;font-size:1.302cqw;font-weight:700;letter-spacing:.3125cqw;line-height:1.3;color:#8FC1FF}
.cvr .tt{position:absolute;left:7.708%;top:40.2%;margin:0;font-size:4.01cqw;font-weight:800;line-height:1.195;letter-spacing:-.05cqw;color:#fff}
.cvr .ln{display:block;overflow:hidden}
.cvr .ln>span{display:block}
.cvr .cap{position:absolute;left:1.4%;bottom:2.2%;font-size:max(10px,.75cqw);color:rgba(255,255,255,.72)}
.cvr .go{position:absolute;left:7.708%;top:62%;display:inline-flex;align-items:center;gap:.5em;padding:.8em 1.5em;border-radius:3em;border:1px solid rgba(255,255,255,.55);background:rgba(6,20,44,.45);color:#fff;font:700 max(12px,1.05cqw)/1 Pretendard,sans-serif;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.cvr .go:hover{background:rgba(24,87,165,.75);border-color:#8FC1FF}
.js .cvr .an{opacity:0}
.js .cvr.play .a-logo{animation:rise16 .7s cubic-bezier(.33,1,.68,1) calc(.25s - var(--t0,0s)) both}
.js .cvr.play .a-kk{animation:kk 1.1s cubic-bezier(.33,1,.68,1) calc(.55s - var(--t0,0s)) both}
.js .cvr.play .a-t1{animation:mask .8s cubic-bezier(.33,1,.68,1) calc(var(--d1,.85s) - var(--t0,0s)) both}
.js .cvr.play .a-t2{animation:mask .8s cubic-bezier(.33,1,.68,1) calc(var(--d2,1.55s) - var(--t0,0s)) both}
.js .cvr.play .a-go{animation:rise16 .7s cubic-bezier(.33,1,.68,1) calc(2.4s - var(--t0,0s)) both}
.paused .an{animation-play-state:paused!important}
@keyframes rise16{from{opacity:0;transform:translateY(.83cqw)}to{opacity:1;transform:none}}
@keyframes kk{0%{opacity:0;letter-spacing:1.146cqw}60%{opacity:1}100%{opacity:1;letter-spacing:.3125cqw}}
@keyframes mask{0%{opacity:0;transform:translateY(95%)}40%{opacity:1}100%{opacity:1;transform:none}}
.foot{max-width:1280px;margin:0 auto;padding:18px 16px 46px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.foot p{flex:1 1 100%;margin:4px 2px 0;font-size:13px;color:var(--mute)}
/* 나레이션 보기 */
.pv{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px 16px;background:#08111f}
.pv[hidden]{display:none}
body.pv-on{overflow:hidden}
.pv-stage{position:relative;overflow:hidden;width:min(100%,calc((100vh - 170px)*16/9));aspect-ratio:16/9;background:#fff;border-radius:4px;container-type:inline-size}
.pslide{position:absolute;inset:0;overflow:hidden}
.pv-sub{width:min(100%,1100px);min-height:2.9em;margin:0;color:#fff;text-align:center;font-size:clamp(15px,1.9vw,21px);font-weight:600;line-height:1.45}
.pv-ctl{display:flex;align-items:center;gap:12px;width:min(100%,1100px);color:#c9d4e3;font-size:13.5px}
.pv-ctl button{flex:none;min-width:44px;height:40px;padding:0 14px;border-radius:40px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;font:700 14px/1 Pretendard,sans-serif;cursor:pointer}
.pv-ctl button:hover{background:rgba(255,255,255,.12)}
.pv-ctl input{flex:1;min-width:60px;accent-color:#8FC1FF}
.pv-ctl .tm{flex:none;font-variant-numeric:tabular-nums}
.pv-rot{display:none;margin:0;color:#8fa3bb;font-size:12.5px}
@media (max-width:700px) and (orientation:portrait){.pv-rot{display:block}}
@media (max-width:640px){
  .bar{gap:10px;padding:8px 12px}
  .bar .lg img{height:20px}
  .bar .ttl{display:none}
  .bar .acts{margin-left:auto;display:flex;gap:6px}
  .btn{min-height:38px;padding:0 12px;font-size:13px}
  .btn small{display:none}
  #deck{padding:14px 10px 6px;gap:18px}
  .stage{border-radius:4px}
  .pv-ctl{gap:8px}
  .pv-ctl .tm{display:none}
}
@media (min-width:641px){.bar .acts{display:flex;gap:8px}}

if('IntersectionObserver' in window&&!RM){
  var near=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)arm(e.target)})},{rootMargin:'120% 0px'});
  var view=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)start(e.target)})},{threshold:.4});
  secs.forEach(function(s){near.observe(s);view.observe(s);
    s.querySelector('.stage').addEventListener('click',function(){var st=S[+s.getAttribute('data-p')];if(st&&st.state==='done'){st.state='idle';st.want=true;arm(s)}})});
}
// 표지
var cover=deck.querySelector('.cover .cvr'),t0=TL[0];
function coverDelays(el){el.style.setProperty('--d1',t0.tl[0]+'s');el.style.setProperty('--d2',t0.tl[1]+'s')}
if(cover){coverDelays(cover);if(!RM)requestAnimationFrame(function(){cover.classList.add('play')})}

// ── 나레이션과 함께 보기 (회사소개 영상과 같은 나레이션·자막·시각)
var pv=$('#pv'),pst=$('#pvStage'),sub=$('#pvSub'),seek=$('#pvSeek'),bPlay=$('#pvPlay'),tm=$('#pvTime'),au=null,live={},lastFocus=null;
seek.max=D.total;
function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+p2(s%60)}
function fitPV(){pst.style.setProperty('--s',pst.clientWidth/1920)}
if(window.ResizeObserver)new ResizeObserver(fitPV).observe(pst);else addEventListener('resize',fitPV);
function makeScene(i,local){var it=TL[i],w=mk('div','pslide');
  if(it.cover){var c=cover.cloneNode(true);c.classList.remove('play');var g=c.querySelector('.go');if(g)g.remove();
    var v=c.querySelector('video');c.style.position='absolute';c.style.inset='0';w.appendChild(c);coverDelays(c);c.style.setProperty('--t0',local+'s');
    void c.offsetWidth;c.classList.add('play');if(v){v.muted=true;v.playsInline=true;try{v.currentTime=local%17}catch(_){}if(!au.paused)v.play().catch(function(){})}
    return {el:w,update:function(){},video:v}}
  var cv=makeCanvas(byP[it.p],false);w.appendChild(cv.el);return {el:w,update:cv.update}}
function sceneAt(T){var i=0;for(var j=0;j<TL.length;j++)if(TL[j].start<=T)i=j;return i}
function clearLive(){Object.keys(live).forEach(function(j){live[j].el.remove()});live={}}
function tick(){
  var T=au.currentTime,i=sceneAt(T),need={};need[i]=1;if(i>0&&T<TL[i].start+XF)need[i-1]=1;
  Object.keys(live).forEach(function(j){if(!need[j]){live[j].el.remove();delete live[j]}});
  Object.keys(need).map(Number).sort(function(a,b){return a-b}).forEach(function(j){
    if(!live[j]){live[j]=makeScene(j,T-TL[j].start);pst.appendChild(live[j].el);if(TL[j+1]&&TL[j+1].p)preload(byP[TL[j+1].p])}
    live[j].update(T-TL[j].start);live[j].el.style.opacity=(j===i&&i>0)?cl((T-TL[j].start)/XF):1});
  var s='';TL.forEach(function(it){it.cues.forEach(function(c){if(c[0]<=T&&T<c[1])s=c[2]})});if(sub.textContent!==s)sub.textContent=s;
  seek.value=T;tm.textContent=fmt(T)+' / '+fmt(D.total);
  if(!pv.hidden&&!au.paused)requestAnimationFrame(tick)}
function setPaused(on){pv.classList.toggle('paused',on);bPlay.textContent=on?'▶':'❚❚';bPlay.setAttribute('aria-label',on?'재생':'일시정지');
  Object.keys(live).forEach(function(j){var v=live[j].video;if(v){if(on)v.pause();else v.play().catch(function(){})}})}
function openPV(){
  if(!au){au=new Audio('video/profile-narr_kr.mp3'+V);au.preload='auto';
    au.addEventListener('play',function(){setPaused(false);requestAnimationFrame(tick)});
    au.addEventListener('pause',function(){setPaused(true)});
    au.addEventListener('ended',function(){setPaused(true);bPlay.textContent='↻';bPlay.setAttribute('aria-label','처음부터 다시')})}
  lastFocus=document.activeElement;pv.hidden=false;document.body.classList.add('pv-on');fitPV();
  var dv=cover&&cover.querySelector('video');if(dv)dv.pause();
  TL.forEach(function(it){if(it.p)preload(byP[it.p])});
  clearLive();au.currentTime=0;au.play().catch(function(){setPaused(true)});tick();bPlay.focus();
  if(window.gtag)gtag('event','profile_narration_open')}
function closePV(){if(au)au.pause();pv.hidden=true;document.body.classList.remove('pv-on');clearLive();sub.textContent='';
  var dv=cover&&cover.querySelector('video');if(dv)dv.play().catch(function(){});if(lastFocus)lastFocus.focus()}
[].forEach.call(document.querySelectorAll('[data-narr]'),function(b){b.addEventListener('click',openPV)});
bPlay.addEventListener('click',function(){if(au.ended){au.currentTime=0;clearLive()}if(au.paused)au.play();else au.pause()});
$('#pvClose').addEventListener('click',closePV);
seek.addEventListener('input',function(){au.currentTime=+seek.value;clearLive();tick()});
document.addEventListener('keydown',function(e){if(pv.hidden)return;
  if(e.key==='Escape'){closePV()}else if(e.key===' '&&e.target===document.body){e.preventDefault();bPlay.click()}
  else if(e.key==='ArrowRight'||e.key==='ArrowLeft'){au.currentTime=cl(au.currentTime+(e.key==='ArrowRight'?5:-5),0,D.total);clearLive();tick()}});
})();
</script>
</body>
</html>
