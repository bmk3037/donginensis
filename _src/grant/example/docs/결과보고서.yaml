  - 소제목: 가. 추진 목적
  - 문단: 생산 설비의 가동 상태를 실시간으로 파악하지 못해 고장 대응이 늦고 비가동 시간이 길었다. 설비 데이터를 자동 수집하고 이상을 즉시 알리는 모니터링 체계를 갖춰 비가동 시간을 줄이는 것이 목적이다.
  - 소제목: 나. 사업비
    표:
      머리: [구분, 정부지원금, 자부담(현금), 자부담(현물), 합계]
      행: [[금액(원), 21000000, 9000000, 0, 30000000]]
      주석: "※ 협약서 기준 (단위: 원)"
      너비: [30, 35, 35, 35, 35]
  - 제목: 2. 추진 내용 및 결과
  - 소제목: "T1. 설비 데이터 수집 장치 설치"
    목록:
      - 생산라인 3개 라인에 전력·진동 센서와 데이터 수집 게이트웨이 설치 (2026. 7. 14. ~ 7. 16.)
      - 라인별 수집 주기 1초, 게이트웨이에서 서버로 전송
    사진:
      - {파일: "evidence/E01_*", 설명: 센서·게이트웨이 설치}
  - 소제목: "T2. 모니터링 대시보드 구축"
    목록:
      - 실시간 설비 상태 대시보드와 이상 알림(문자·메신저) 기능 개발
      - 2026. 9. 2. 운영 시작
    사진:
      - {파일: "evidence/E02_*", 설명: 대시보드 운영 화면}
  - 제목: 3. 성과지표 달성 현황
    표:
      머리: [성과지표, 목표, 실적, 달성률, 증빙]
      행:
        - [설비 데이터 수집 라인 수, 3개 라인, 3개 라인, 100%, "E01 설치 사진"]
        - [설비 비가동 시간 감소율, 10%, 12%, 120%, "E04 전후 비교 데이터"]
      너비: [48, 22, 22, 20, 46]
  - 강조: E04 비가동 시간 전후 비교 데이터는 생산팀에서 11월 25일까지 제출 예정
  - 제목: 4. 기대효과 및 향후 계획
    목록:
      - 비가동 시간 감소로 생산량 증가와 납기 준수율 향상
      - 2027년 나머지 2개 라인으로 확대 적용 예정
