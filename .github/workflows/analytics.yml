# 매일 GA4·서치콘솔 데이터를 구글 시트로 모은다(마케팅 대시보드·분석용). 설정 방법은 _src/seo/analytics_pull.py 맨 위.
# 데이터는 저장소에 남기지 않는다(공개 저장소). 설정 전에는 아무것도 하지 않고 끝난다.
name: Analytics

on:
  schedule:
    - cron: '17 21 * * *'   # 매일 오전 6:17 (한국 시간)
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q google-auth requests
      - name: GA4·서치콘솔 → 구글 시트
        env:
          GA_SA_KEY: ${{ secrets.GA_SA_KEY }}
          GA_PROPERTY_ID: ${{ vars.GA_PROPERTY_ID }}
          GA_SHEET_ID: ${{ vars.GA_SHEET_ID }}
          GSC_SITE: ${{ vars.GSC_SITE }}
        run: python3 _src/seo/analytics_pull.py
